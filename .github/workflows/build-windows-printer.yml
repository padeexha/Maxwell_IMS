name: Build Windows Printer Server

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/print_server.py'
      - 'requirements-printer-windows.txt'
      - 'printer-server/windows/**'
      - '.github/workflows/build-windows-printer.yml'

permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-printer-windows.txt
      - name: Build executable
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --console
          --name MaxwellPrinterServer --collect-all qrcode --hidden-import win32timezone --hidden-import win32crypt --hidden-import pywintypes
          scripts/print_server.py
      - name: Assemble package
        shell: pwsh
        run: |
          $release = 'release/MaxwellPrinterServer-windows-x64'
          New-Item -ItemType Directory -Force -Path $release | Out-Null
          Copy-Item dist/MaxwellPrinterServer.exe $release/
          Copy-Item printer-server/windows/Start-Maxwell-Printer-Server.bat $release/
          Copy-Item printer-server/windows/README.txt $release/
          Compress-Archive -Path "$release/*" -DestinationPath release/MaxwellPrinterServer-windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: MaxwellPrinterServer-windows-x64
          path: release/MaxwellPrinterServer-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
